<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Carrusel</title>

<style>

body{
    margin:0;
    background:white;
    font-family:Arial, sans-serif;
}

.slider{
    position:relative;
    width:100%;
    max-width:1200px;
    margin:auto;
    overflow:hidden;
}

.slides{
    display:flex;
    transition:transform 0.5s ease;
}

.slide{
    min-width:100%;
    box-sizing:border-box;
}

.slide img{
    width:100%;
    height:auto;
    display:block;
}

button{
    position:absolute;
    top:50%;
    transform:translateY(-50%);
    background:rgba(0,0,0,0.5);
    color:white;
    border:none;
    padding:12px;
    cursor:pointer;
    font-size:24px;
    z-index:10;
}

.prev{
    left:10px;
}

.next{
    right:10px;
}

.dots{
    text-align:center;
    padding:15px 0;
}

.dot{
    height:12px;
    width:12px;
    margin:0 5px;
    background:#bbb;
    border-radius:50%;
    display:inline-block;
    cursor:pointer;
}

.active{
    background:#333;
}

@media(max-width:768px){

    button{
        font-size:18px;
        padding:8px;
    }

}

</style>
</head>

<body>

<div class="slider">

    <div class="slides" id="slides">

    <div class="slide"><img src="IMG_2951.PNG"></div>
    <div class="slide"><img src="IMG_2952.PNG"></div>
    <div class="slide"><img src="IMG_2953.PNG"></div>
    <div class="slide"><img src="IMG_2954.PNG"></div>
    <div class="slide"><img src="IMG_2955.PNG"></div>

    <div class="slide"><img src="IMG_2956.PNG"></div>
    <div class="slide"><img src="IMG_2957.PNG"></div>
    <div class="slide"><img src="IMG_2958.PNG"></div>
    <div class="slide"><img src="IMG_2959.PNG"></div>
    <div class="slide"><img src="IMG_2960.PNG"></div>

    <div class="slide"><img src="IMG_2961.PNG"></div>
    <div class="slide"><img src="IMG_2962.PNG"></div>
    <div class="slide"><img src="IMG_2963.PNG"></div>
    <div class="slide"><img src="IMG_2964.PNG"></div>
    <div class="slide"><img src="IMG_2965.PNG"></div>

    <div class="slide"><img src="IMG_2966.PNG"></div>
    <div class="slide"><img src="IMG_2967.PNG"></div>
    <div class="slide"><img src="IMG_2968.PNG"></div>
    <div class="slide"><img src="IMG_2969.PNG"></div>
    <div class="slide"><img src="IMG_2970.PNG"></div>

    <div class="slide"><img src="IMG_2971.PNG"></div>
    <div class="slide"><img src="IMG_2972.PNG"></div>
    <div class="slide"><img src="IMG_2973.PNG"></div>
    <div class="slide"><img src="IMG_2974.PNG"></div>
    <div class="slide"><img src="IMG_2975.PNG"></div>

</div>

    </div>

    <button class="prev" onclick="moveSlide(-1)">❮</button>
    <button class="next" onclick="moveSlide(1)">❯</button>

</div>

<div class="dots">
    <span class="dot active" onclick="currentSlide(0)"></span>
    <span class="dot" onclick="currentSlide(1)"></span>
    <span class="dot" onclick="currentSlide(2)"></span>
</div>

<script>

let index = 0;

const slides = document.getElementById("slides");
const dots = document.querySelectorAll(".dot");

function showSlide(i){

    if(i < 0){
        index = dots.length - 1;
    }
    else if(i >= dots.length){
        index = 0;
    }
    else{
        index = i;
    }

    slides.style.transform = `translateX(-${index * 100}%)`;

    dots.forEach(dot => dot.classList.remove("active"));
    dots[index].classList.add("active");
}

function moveSlide(step){
    showSlide(index + step);
}

function currentSlide(i){
    showSlide(i);
}

setInterval(() => {
    moveSlide(1);
}, 5000);

</script>

</body>
</html>
